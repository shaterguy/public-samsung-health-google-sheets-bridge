name: Android Install Smoke Observer

on:
  workflow_run:
    workflows: ["Android Install Smoke"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record install smoke result
        shell: bash
        env:
          OBSERVED_RUN_ID: ${{ github.event.workflow_run.id }}
          OBSERVED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          OBSERVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/install-smoke-observed.json <<EOF
          {
            "run_id": "$OBSERVED_RUN_ID",
            "conclusion": "$OBSERVED_CONCLUSION",
            "source_sha": "$OBSERVED_SHA",
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/install-smoke-observed.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Android install smoke result'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
