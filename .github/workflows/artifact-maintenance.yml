name: Actions artifact maintenance

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: health-bridge-artifact-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete Actions artifacts older than 7 days
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          cutoff_epoch="$(date -u -d '7 days ago' +%s)"
          deleted=0
          while IFS=$'\t' read -r artifact_id created_at; do
            [[ -z "${artifact_id:-}" ]] && continue
            created_epoch="$(date -u -d "$created_at" +%s)"
            if [[ "$created_epoch" -lt "$cutoff_epoch" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >/dev/null
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .created_at] | @tsv'
          )
          remaining="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts | length' | awk '{ total += $1 } END { print total + 0 }')"
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
      - name: Record verified result
        shell: bash
        env:
          DELETED: ${{ steps.cleanup.outputs.deleted }}
          REMAINING: ${{ steps.cleanup.outputs.remaining }}
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/artifact-maintenance-report.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "run_id": "$GITHUB_RUN_ID",
            "event": "$GITHUB_EVENT_NAME",
            "deleted_artifacts": $DELETED,
            "remaining_artifacts": $REMAINING,
            "retention_days": 7,
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/artifact-maintenance-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Actions artifact maintenance result"
            git push
          fi
