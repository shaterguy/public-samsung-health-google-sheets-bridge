name: KST Signed Update APK

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/kst-update-apk.yml"

permissions:
  contents: read

jobs:
  signed-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test and build unsigned release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify update APK
        shell: bash
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.HEALTHBRIDGE_PUBLIC_SIGNING_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE_BASE64"
          rm -rf /tmp/healthbridge-public-signing dist
          mkdir -p /tmp/healthbridge-public-signing dist
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/healthbridge-public-signing/bundle.tar.gz
          tar -xzf /tmp/healthbridge-public-signing/bundle.tar.gz -C /tmp/healthbridge-public-signing
          test -s /tmp/healthbridge-public-signing/key.pk8
          test -s /tmp/healthbridge-public-signing/cert.pem

          EXPECTED_SHA256="98ec08ec0640003688d3c99a608cba45c75c0caea33e63d286fc640e4f454292"
          ACTUAL_SHA256="$(openssl x509 -in /tmp/healthbridge-public-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -P 16 -f -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk dist/app-aligned.apk
          "$BT/apksigner" sign \
            --key /tmp/healthbridge-public-signing/key.pk8 \
            --cert /tmp/healthbridge-public-signing/cert.pem \
            --out dist/HealthBridge-v0.3.6-KST-update.apk \
            dist/app-aligned.apk
          rm dist/app-aligned.apk

          "$BT/apksigner" verify --verbose --print-certs dist/HealthBridge-v0.3.6-KST-update.apk | tee dist/signing-certificate.txt
          "$BT/zipalign" -c -P 16 -v 4 dist/HealthBridge-v0.3.6-KST-update.apk | tee dist/zipalign-verification.txt
          grep -q 'Verification successful' dist/zipalign-verification.txt
          CERT_SHA256="$(grep -i 'Signer #1 certificate SHA-256 digest:' dist/signing-certificate.txt | head -n1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')"
          test "$CERT_SHA256" = "$EXPECTED_SHA256"
          "$BT/aapt" dump badging dist/HealthBridge-v0.3.6-KST-update.apk | tee dist/apk-badging.txt
          grep -q "package: name='com.personal.healthbridge.reinstall'" dist/apk-badging.txt
          grep -q "versionCode='12'" dist/apk-badging.txt
          grep -q "versionName='0.3.6'" dist/apk-badging.txt
          unzip -t dist/HealthBridge-v0.3.6-KST-update.apk >/dev/null
          (cd dist && sha256sum HealthBridge-v0.3.6-KST-update.apk > HealthBridge-v0.3.6-KST-update.sha256)

      - name: Upload signed update APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthBridge-v0.3.6-KST-update
          path: |
            dist/HealthBridge-v0.3.6-KST-update.apk
            dist/HealthBridge-v0.3.6-KST-update.sha256
            dist/signing-certificate.txt
            dist/apk-badging.txt
            dist/zipalign-verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -rf /tmp/healthbridge-public-signing
